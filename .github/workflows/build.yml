name: Build
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # The ground station binary, which is aarch64 and therefore not something the
  # x86 job above can produce. Built in a Debian bookworm container on an arm64
  # runner: no emulation, and - the part that matters - against bookworm's
  # glibc, which is what the ground stations run. Built against a newer one it
  # would fail to start with a GLIBC_2.xx error on a device in a field.
  build_rockchip:
    name: Build for a Rockchip ground station
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      - name: Install deps
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git ca-certificates gcc make pkg-config libevent-dev libcairo2-dev \
            libcurl4-openssl-dev libjpeg-dev libx11-dev libxext-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -B DRV=$PWD OUTPUT=msposd_rockchip rockchip
          ls -l msposd_rockchip

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: msposd_rockchip
          path: msposd_rockchip

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          sudo apt-get update
          # libcurl and libjpeg are this fork's: the map widget fetches tiles over
          # HTTP and decodes them. Without them the native target stops at
          # curl/curl.h and the rockchip build below never runs.
          DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC sudo apt-get -y install git make wget gcc libevent-dev libcsfml-dev file g++ cpio unzip rsync bc bzip2 libcairo-dev libcurl4-openssl-dev libjpeg-dev libx11-dev libxext-dev qemu-user-static
          ./build.sh goke
          ./build.sh hisi
          ./build.sh star6b0
          ./build.sh star6e
          ./build.sh native

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          path: |
              msposd_goke
              msposd_hisi
              msposd_star6b0
              msposd_star6e
              msposd

      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            msposd_goke
            msposd_hisi
            msposd_star6b0
            msposd_star6e
            msposd
            msposd_rockchip

      - name: Upload latest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            msposd_goke
            msposd_hisi
            msposd_star6b0
            msposd_star6e
            msposd
            msposd_rockchip
