# Minimal Orange - the Minimal layout in an orange palette.
#
# Everything but the colours comes from minimal-orchid: the square panels, the
# compact sizing, the upright hatching. Change those there and every variant
# follows.

[theme]
; Relative to this file, not to wherever msposd was started from.
inherit        = ../minimal-orchid/theme.ini
name           = Minimal Orange
text_outline_color = #C8281208

[colors]
; Only the chrome is themed. good/warn/crit are what a pilot reads out of the
; corner of an eye, and a palette is no reason for "turn back now" to be a
; different colour than it is everywhere else.
; `warn` is amber and so is this theme, so the chrome is a pale peach and
; the warning keeps the saturated amber to itself.
accent     = FFC79E
label      = C79A78
panel_fill = DC221408
panel_edge = 7A5026
track      = CC301C0C
peak       = FFE2CC
