; msposd widget theme.
; Copy this folder, edit, and it is a new theme - nothing here is hard-coded.
; Unknown keys are ignored and bad values keep their default, so a mistake in
; here degrades the look but never takes the OSD down.

[osd]
; classic = the flight controller's own glyph text, untouched
; fancy   = graphical widgets
mode    = fancy
opacity = 1.0          ; global, multiplies every widget's alpha
scale   = 1.0          ; global, multiplies every widget's size

[theme]
name           = Tactical
font           = fonts/UbuntuMono-Regular.ttf
panel_min_width = 250
panel_height   = 104
tab_height     = 36    ; raised tab holding the value
chamfer        = 14    ; bottom-right corner cut
pad_x          = 13
pad_y          = 11
bar_height     = 16
value_size     = 25
label_size     = 11
label_tracking = 2.5
hatch_period   = 7     ; stripe pitch, px
hatch_duty     = 0.64  ; fraction of the pitch that is stripe
hatch_slant    = -0.45 ; x shift per y, negative leans right
; how long a vanished element keeps being drawn, ms. Flight controllers blink
; critical values by alternating them with blank, so this must exceed the blink
; off-period or the widget disappears exactly when the reading matters most.
element_hold_ms = 2000
; Outline behind every string, and the colour every outline on screen uses -
; the heading's geometry outline picks up this colour too. Small light text over
; a bright frame is unreadable without it.
text_outline       = yes
text_outline_color = #C0000000
text_outline_width = 1

[colors]
; RRGGBB or AARRGGBB
accent     = 00E5FF
warn       = FFB300
crit       = FF3B30
good       = 00FF9C
threat     = FF6A1F
panel_fill = D60A1A26   ; alpha 0xD6 -> translucent over video
panel_edge = 0E3D52
track      = CC06222E
label      = 4FA8C4
peak       = 8FD8EA

[voltage]
cell_min  = 3.00       ; bar scale
cell_max  = 4.35
cell_warn = 3.60       ; amber below this
cell_crit = 3.40       ; red below this

[elements]
; which recognised elements are drawn as widgets, plus per-element
; opacity (0..1) and size scale (0.3..4.0)
voltage           = on
voltage_opacity   = 1.0
voltage_scale     = 1.0
current           = on
current_opacity   = 1.0
current_scale     = 1.0
altitude          = on
mah               = on
rssi              = on
sats              = on
sats_scale        = 0.7      ; icon-only, so it needs less room
throttle          = on
flight_time       = on
flight_mode       = on
warning           = on
warning_scale     = 1.0
; lat/lon drive the map rather than drawing value panels of their own: where you
; place them on the flight controller defines the map's rectangle - latitude at
; the top-left corner, longitude at the bottom-right.
latitude          = on
longitude         = on

[ahi]
; The artificial horizon stays pitch-coloured - level, moderate and steep must
; read differently at a glance - but which colours those are is up to the theme.
;
; scheme picks a preset:
;   classic  green / yellow / red, white ladder   (msposd's original)
;   tactical cyan  / yellow / red, white ladder   (matches this theme)
;   mono     white throughout
;   heat     cyan / magenta / red, blue ladder
scheme = tactical

; Or set them individually, which overrides the preset. Colours are palette
; names, because the horizon is drawn through msposd's fixed colour table:
;   red green blue yellow magenta cyan white black gray
; level_color    = cyan
; moderate_color = yellow
; steep_color    = red
; line_color     = white

level_max       = 2     ; degrees; below this the aircraft counts as level
moderate_max    = 10    ; degrees; beyond this counts as steep
steep_thickness = 5     ; the centre bar thickens when steep

[map]
enabled   = on
style     = hybrid     ; roads | satellite | hybrid
zoom      = 16         ; 1..19, used when auto_zoom = off
opacity   = 1.0

; north = the map keeps north up, track = it turns so your ground track is up.
; Track-up is easier to fly to and harder to orient by, so a compass rose is
; drawn in the corner whenever it is on.
orientation = north

; The view follows the ground track rather than sitting still on the aircraft.
; A fixed zoom is wrong at both ends of the speed range: hovering it shows a
; patch you could walk across, and at 30 m/s it shows where you have been.
auto_zoom  = on
zoom_min   = 14        ; furthest out the map will go, however fast you are
zoom_max   = 17        ; closest in; also where the map sits when stationary
lookahead  = 20        ; seconds of travel that must fit across the map
; How far ahead of the aircraft the map centres, in seconds of travel, and how
; far back that is allowed to push the marker. `lead` sets how quickly the
; marker slides back as you speed up; `lead_max` is where it stops - a fraction
; of the half-viewport, so the marker can never leave its own map. At these
; values the ceiling is reached around 6 m/s: above that the marker parks a
; third of the way back and the zoom is what keeps widening the ground ahead.
; Lower `lead` to keep the seconds figure governing further up the speed range,
; or set it to 0 to centre on the aircraft as before.
lead       = 6
lead_max   = 0.35
; A zoom change throws away every tile on screen and fetches a new set, so a new
; zoom has to be what the speed has been asking for this long before it is taken.
zoom_settle_ms = 3000
smooth_ms      = 1500  ; easing time constant for the speed and the lead offset
; Upper bound on the rectangle the two elements span. Without a cap, placing
; latitude and longitude far apart covers most of the video, which is unflyable.
max_width  = 420
max_height = 300
cache_dir = /tmp/msposd-tiles

# Heading display. Where it goes comes from the flight controller - wherever the
# compass bar is placed - and the heading itself from MSP_ATTITUDE, so none of
# this depends on reading the bar's glyphs. Both firmwares fix the bar's width,
# which is why the size is set here instead.
[heading]
# band | rose | ring | navball | numeric
style = band
# Band/ring width, or rose/navball diameter, in pixels.
size = 480
# Band only: degrees visible end to end. 45..120 - narrow reads fast in a turn,
# wide gives more context.
span = 90
# A second marker at the ground course. On a wing in wind this is where you are
# actually going, which is not where the nose points.
show_track = yes
# Ring only.
flip = no
lens = 0.62
# Outline behind the ticks and markers as well as the numbers. A compass is thin
# lines over live video, and thin lines over snow or sky disappear without it.
outline = yes
outline_width = 2

# Ground-side link statistics - wfb-ng or APFPV.
#
# The only widget here the flight controller knows nothing about: wfb-ng and
# APFPV live on this side of the link, so there is no element on the OSD grid to
# anchor to. Position, size and style are therefore set here rather than being
# inherited from wherever you placed something in Betaflight or INAV.
#
# The numbers arrive through a small ini the ground station writes, the same way
# this file arrives at msposd. A station that has not been taught to write it
# leaves `source` empty and the widget simply does not appear.
[link]
enabled = yes
# vertical   - antennas stacked, for the left or right edge
# horizontal - antennas side by side, for the top or bottom
style = vertical
# Top-left corner, as a percentage of the screen. Percent rather than pixels so
# a layout carries over between a 720p and a 1080p ground station. Clamped, so a
# value near 100 pulls the widget back on screen instead of off the edge.
x = 2
y = 34
scale = 1.0
opacity = 1.0
# Where the ground station writes its stats. Empty disables the widget.
source =
# How long the last numbers stay up once the writer stops, ms. Past this the
# widget says NO DATA rather than showing a dead link's final reading all flight.
hold_ms = 3000
